<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dungeon Hero</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="game">

    <!-- =====================
         TITEL
    ====================== -->

    <h1>Die verlassene Mine</h1>


    <!-- =====================
         INFORMATIONEN
    ====================== -->

    <div class="game-info">

        <p>
            🗺️ Raum:
            <span id="dungeonProgress">
                1 / 5
            </span>
        </p>

        <p>
            ⭐ XP:
            <span id="heroXP">
                0
            </span>
        </p>

    </div>


    <!-- =====================
         KAMPFBILDSCHIRM
    ====================== -->

    <div id="combatScreen">

        <div class="battlefield">


            <!-- HELD -->

            <div class="fighter">

                <h2>Held</h2>

                <div class="character hero">
                    🧙
                </div>

                <div class="health-bar">

                    <div
                        id="heroHealthBar"
                        class="health-fill">
                    </div>

                </div>

                <p>

                    ❤️

                    <span id="heroHealth">
                        100
                    </span>

                    / 100

                </p>

            </div>


            <!-- KAMPFMELDUNG -->

            <div class="battle-text">

                <p id="battleMessage">
                    Der Kampf beginnt!
                </p>

            </div>


            <!-- MONSTER -->

            <div class="fighter">

                <h2 id="monsterName">
                    Monster
                </h2>

                <div class="character monster">
                    👹
                </div>

                <div class="health-bar">

                    <div
                        id="monsterHealthBar"
                        class="health-fill">
                    </div>

                </div>

                <p>

                    ❤️

                    <span id="monsterHealth">
                        40
                    </span>

                    /

                    <span id="monsterMaxHealth">
                        40
                    </span>

                </p>

            </div>


        </div>


        <!-- =====================
             FÄHIGKEITEN
        ====================== -->

        <div class="abilities">

            <button id="attackButton">

                ⚔️ Schwerer Schlag

            </button>

        </div>


    </div>


    <!-- =====================
         LOOT-BILDSCHIRM
    ====================== -->
<button id="inventoryButton">
    🎒 Inventar
</button>
    <div
    id="inventoryScreen"
    class="inventory-screen hidden"
>

    <h2>🎒 Inventar</h2>

    <div id="inventoryList">
    </div>

    <button id="closeInventoryButton">
        Zurück
    </button>

</div>
    <div
        id="lootPanel"
        class="loot-panel hidden"
    >

        <h2>
            🎁 Dungeon-Belohnung
        </h2>

        <div
            id="lootResults"
            class="loot-results"
        >
        </div>

    </div>


</div>


<script src="game.js"></script>

</body>

</html>
